[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reflector"
version = "0.7.0"
description = "Kaggle-first symbolic ARC-AGI-3 research platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arc-agi==0.9.9",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "requests-mock>=1.12.1",
    "ruff>=0.11.4",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15.0",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1,<9",
    "ruff>=0.11.4",
]
agentops = [
    "agentops>=0.4.18",
]

[project.scripts]
reflector = "reflector.cli:main"
reflector-kaggle = "reflector.kaggle:main"
kaggle_smoke_test = "reflector.kaggle:smoke_test"

[tool.mypy]
strict = true
disallow_untyped_defs = true
exclude = [
    "tests",
    "agents",
    "reflector/kaggle.py",
    "reflector/kaggle_probe.py",
]
plugins = []

[tool.ruff.lint]
extend-select = ["I"]

[tool.setuptools.packages.find]
include = ["reflector*", "agents*"]
exclude = ["tests*", "recordings*"]

[tool.uv]
package = true
