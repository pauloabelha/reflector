[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reflector2"
version = "0.1.0"
description = "Minimal sparse schema-graph research substrate"
requires-python = ">=3.11"

[project.scripts]
reflector2-benchmark = "reflector2.benchmark:main"
reflector2-raw-frame = "reflector2.raw_frame:main"
reflector2-evaluate-first-frames = "reflector2.evaluate_first_frames:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
